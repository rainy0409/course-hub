<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c3049">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>豆沙馅和下雨天</title>
<script>try{if(localStorage.getItem('coursehub-theme')==='dark')document.documentElement.dataset.theme='dark';}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%231c3049'/%3E%3Crect x='4' y='4' width='32' height='32' rx='6' fill='none' stroke='%23c9a86a' stroke-opacity='.5'/%3E%3Ctext x='20' y='22' text-anchor='middle' dominant-baseline='central' font-family='Georgia,serif' font-size='20' fill='%23dcc08a'%3E%E2%88%91%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.cn">
<link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin>
<link href="https://fonts.googleapis.cn/css2?family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20260904h">
</head>
<body>

<canvas id="bgCanvas" aria-hidden="true"></canvas>
<div class="bg-grid" aria-hidden="true"></div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="34" height="34">
          <defs>
            <linearGradient id="bmGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#2d4a6b"/>
              <stop offset="1" stop-color="#142639"/>
            </linearGradient>
          </defs>
          <rect x="1" y="1" width="38" height="38" rx="10" fill="url(#bmGrad)"/>
          <rect x="4.5" y="4.5" width="31" height="31" rx="7" fill="none" stroke="#c9a86a" stroke-opacity=".45"/>
          <text x="20" y="21.5" text-anchor="middle" dominant-baseline="central" font-family="Georgia,'Times New Roman',serif" font-size="21" fill="#dcc08a">&#8721;</text>
        </svg>
      </div>
      <div class="brand-text">
        <h1>课程管理平台</h1>
        <p id="brandSub">加载中…</p>
      </div>
    </div>

    <div class="topbar-right">
      <div class="week-chip" id="weekChip" title="按学期第一周计算">
        <span class="week-chip-label">第</span>
        <span class="week-chip-num" id="weekNum">–</span>
        <span class="week-chip-label">周</span>
      </div>

      <div class="person-switch" id="personSwitch" role="group" aria-label="切换身份">
        <button type="button" class="ps-btn is-active" data-person="both">两人</button>
        <button type="button" class="ps-btn" data-person="me">豆沙馅</button>
        <button type="button" class="ps-btn" data-person="rain">下雨天</button>
      </div>

      <div class="save-chip" id="saveChip" data-state="idle">
        <span class="save-dot"></span><span class="save-text">已保存</span>
      </div>

      <button type="button" class="icon-btn theme-btn" id="themeBtn" title="切换深浅色">🌙</button>
    </div>
  </div>

  <nav class="tabbar" id="tabbar" role="tablist">
    <button type="button" class="tab is-active" data-view="dash">概览</button>
    <button type="button" class="tab" data-view="timetable">课表</button>
    <button type="button" class="tab" data-view="courses">课程</button>
    <button type="button" class="tab" data-view="homework">作业</button>
    <button type="button" class="tab" data-view="exam">考试</button>
    <button type="button" class="tab" data-view="score">量化加分</button>
    <button type="button" class="tab" data-view="settings">设置</button>
  </nav>
</header>

<main id="main" class="main"></main>

<div class="modal-root" id="modalRoot" hidden>
  <div class="modal-mask" data-close="1"></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle">标题</h2>
      <button type="button" class="icon-btn" data-close="1" aria-label="关闭">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<!-- 移动端底部 Tab（≤760px 显示） -->
<nav class="bottom-tab" id="bottomTab" role="tablist">
  <button type="button" class="bt is-active" data-view="dash"><span class="ico">◫</span>概览</button>
  <button type="button" class="bt" data-view="timetable"><span class="ico">▦</span>课表</button>
  <button type="button" class="bt" data-view="homework"><span class="ico">✎</span>作业<span class="dot" id="btHwDot" hidden>0</span></button>
  <button type="button" class="bt" data-view="exam"><span class="ico">⏱</span>考试<span class="dot" id="btExDot" hidden>0</span></button>
  <button type="button" class="bt" data-view="more"><span class="ico">☰</span>更多</button>
</nav>

<!-- 「更多」弹出菜单 -->
<div class="more-sheet" id="moreSheet" hidden>
  <div class="ms-mask" data-close="1"></div>
  <div class="ms-panel">
    <button type="button" class="ms-item" data-view="courses"><span class="ms-ico">📚</span>课程</button>
    <button type="button" class="ms-item" data-view="score"><span class="ms-ico">🧮</span>量化加分</button>
    <button type="button" class="ms-item" data-view="settings"><span class="ms-ico">⚙</span>设置</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="seed.js?v=20260904h"></script>
<script src="app.js?v=20260904h"></script>
<script type="module" src="bg.js?v=20260904h"></script>
</body>
</html>
